name: Scraping Automático de Titulares

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  scraper-job:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargando el código del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurando Python en el servidor
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Instalando librerías
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: 4. Ejecutando Scraper en Vivo
      run: python pruebamarca.py

    # ¡NUEVO PASO! - Esto guarda el archivo .txt para que puedas descargarlo
    - name: 5. Guardar Archivo de Titulares
      uses: actions/upload-artifact@v4
      with:
        name: titulares-marca-hoy # Nombre del paquete que descargarás (.zip)
        path: titulares.txt       # El archivo exacto que queremos guardar
