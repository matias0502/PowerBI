name: Druni Perfumes Scraper

on:
  workflow_dispatch:
    # Esto permite que el script se ejecute ÚNICAMENTE cuando tú hagas clic de forma manual

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configurar Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalar las librerías necesarias
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Ejecutar el script extractor
    - name: Run Druni Scraper script
      run: python pruebadruni.py

    # 5. Guardar el archivo .csv generado en tu repositorio
    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Actualización manual: Perfumes de hombre más vendidos de Druni"
        file_pattern: 'perfumes_hombre_mas_vendidos.csv'
